name: Update NFL Results

on:
  schedule:
    # NFL games are typically:
    # Sunday: 1 PM, 4:25 PM, 8:20 PM ET (18:00, 21:25, 01:20 UTC Mon)
    # Monday: 8:15 PM ET (01:15 UTC Tue) 
    # Playoffs: Saturday/Sunday games in January/February
    
    # Run after Sunday games (Monday 6 AM UTC)
    - cron: '0 6 * 9-12,1-2 1'        # Mondays during NFL season (Sep-Dec, Jan-Feb)
    # Run after Monday games (Tuesday 6 AM UTC)  
    - cron: '0 6 * 9-12,1-2 2'        # Tuesdays during NFL season (Sep-Dec, Jan-Feb)
    # Run after Saturday playoff games (Sunday 6 AM UTC)
    - cron: '0 6 * 1-2 0'             # Sundays during playoffs (Jan-Feb)
    
  workflow_dispatch: # Allow manual trigger

jobs:
  update-results:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Update NFL results
      run: |
        echo "Starting NFL results update..."
        timeout 300 node update-results.js || {
          exit_code=$?
          if [ $exit_code -eq 124 ]; then
            echo "Update timed out after 5 minutes"
            exit 1
          elif [ $exit_code -eq 0 ]; then
            echo "Update completed successfully"
            exit 0
          else
            echo "Update failed with exit code $exit_code"
            exit $exit_code
          fi
        }
      timeout-minutes: 10
      
    - name: Commit and push if changed
      run: |
        git config --global user.name 'NFL Results Bot'
        git config --global user.email 'nfl-bot@users.noreply.github.com'
        git add data/ players/
        if git diff --staged --quiet; then
          echo "✅ No changes to commit"
        else
          echo "📊 Changes detected, committing..."
          git commit -m "Auto-update NFL results - $(date)"
          git push
          echo "✅ Changes pushed successfully"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
