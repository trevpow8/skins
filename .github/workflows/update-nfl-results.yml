name: Update NFL Results

on:
  schedule:
    # Check daily during NFL season at 6 AM UTC (1 AM EST / 10 PM PST)
    # This catches all games: Sunday, Monday, Thursday, Saturday (playoffs)
    - cron: '0 6 * 9-12,1-2 *'        # Daily during NFL season (Sep-Dec, Jan-Feb)
    
  workflow_dispatch: # Allow manual trigger

jobs:
  update-results:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Update NFL results
      run: |
        echo "Starting NFL results update..."
        timeout 300 node update-results.js || {
          exit_code=$?
          if [ $exit_code -eq 124 ]; then
            echo "Update timed out after 5 minutes"
            exit 1
          elif [ $exit_code -eq 0 ]; then
            echo "Update completed successfully"
            exit 0
          else
            echo "Update failed with exit code $exit_code"
            exit $exit_code
          fi
        }
      timeout-minutes: 10
      
    - name: Commit and push if changed
      run: |
        git config --global user.name 'NFL Results Bot'
        git config --global user.email 'nfl-bot@users.noreply.github.com'
        git add data/ players/
        if git diff --staged --quiet; then
          echo "✅ No changes to commit"
        else
          echo "📊 Changes detected, committing..."
          git commit -m "Auto-update NFL results - $(date)"
          git push
          echo "✅ Changes pushed successfully"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
