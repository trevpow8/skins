name: Update NFL Results

on:
  schedule:
    # Run every hour during NFL season (Sep-Feb)
    - cron: '0 */1 * 9-12,1-2 *'
    # Run daily at 6 AM UTC as backup
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-results:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Update NFL results
      run: node update-results.js
      
    - name: Commit and push if changed
      run: |
        git config --global user.name 'NFL Results Bot'
        git config --global user.email 'nfl-bot@users.noreply.github.com'
        git add data/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update NFL results - $(date)"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
